<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d0e12">
  <title>Whisper — Say it without a name</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="wrap">
    <div class="eyebrow">ANONYMOUS · SIMPLE · NO ACCOUNT</div>
    <h1>whisper</h1>
    <p class="intro">Say the thing you never say out loud.<br>Leave it here without your name and let it exist.</p>
  </header>

  <main class="wrap">
    <div class="rule"></div>
    <section class="composer">
      <textarea id="text" maxlength="500" placeholder="Write something you want to say..."></textarea>
      <div class="composer-foot">
        <div class="left">
          <div class="categories">
            <button class="chip active" data-category="Thought">Thought</button>
            <button class="chip" data-category="Secret">Secret</button>
            <button class="chip" data-category="Rant">Rant</button>
            <button class="chip" data-category="Regret">Regret</button>
            <button class="chip" data-category="Good">Something good</button>
          </div>
          <div class="count"><span id="remaining">500</span> characters left</div>
        </div>
        <button class="post" id="publish">Leave it anonymously</button>
      </div>
    </section>

    <div class="wall-head">
      <h2 class="wall-title">what's on the wall</h2>
      <select id="filter" class="filter">
        <option value="All">Everything</option>
        <option value="Thought">Thought</option>
        <option value="Secret">Secret</option>
        <option value="Rant">Rant</option>
        <option value="Regret">Regret</option>
        <option value="Good">Something good</option>
      </select>
    </div>

    <section id="feed"></section>
  </main>

  <footer>WHISPER · NO NAMES · NO ACCOUNTS</footer>
  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
